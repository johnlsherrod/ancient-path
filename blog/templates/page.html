<!DOCTYPE html>
<!-- AP-BLOG-TPL 1.0 · the frame every page shares: head, menu, footer. The index and the article are drawn into {{main_html}}. Brand, menu, footer and Google tag come from the school's row. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{{google_tag_html}}
<title>{{search_title}}</title>
<meta name="description" content="{{search_description}}">
<meta name="ap-build" content="AP-BLOG-TPL 1.0">
<link rel="canonical" href="{{page_url}}">
<meta property="og:site_name" content="{{school_name}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{search_title}}">
<meta property="og:description" content="{{search_description}}">
<meta property="og:url" content="{{page_url}}">
<meta property="og:image" content="{{preview_image_url}}">
<meta property="og:image:width" content="1456">
<meta property="og:image:height" content="819">
<meta property="og:image:alt" content="{{preview_image_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{search_title}}">
<meta name="twitter:description" content="{{search_description}}">
<meta name="twitter:image" content="{{preview_image_url}}">
{{published_html}}<meta name="theme-color" content="{{navy}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{fonts_href}}" rel="stylesheet">
<style>
{{css}}
</style>
</head>
<body>
<a class="skip" href="#main">{{skip_label}}</a>
<header class="tb">
  <div class="tb-in">
    <a class="wm" href="{{site}}">{{school_name}}</a>
    <nav class="nav" aria-label="Site">{{nav_html}}</nav>
    <button class="menu" id="menu" type="button" aria-expanded="false" aria-controls="drawer">Menu</button>
  </div>
  <div class="drawer" id="drawer">{{nav_html}}</div>
</header>
<main id="main">
{{main_html}}
</main>
<footer class="ft" data-build="AP-BLOG-TPL 1.0" data-rules="{{rules}}">
  <div class="ft-in">
    <a class="wm" href="{{site}}">{{school_name}}</a>
    <nav aria-label="Footer">{{footer_html}}</nav>
  </div>
</footer>
<script>
{{js}}
</script>
</body>
</html>
