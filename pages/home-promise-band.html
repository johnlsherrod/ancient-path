<style>

        color: #F3EDE3 !important;
        letter-spacing: -0.01em !important;
        margin: 0 auto;
        max-width: 800px;
    }

    /* a sentence of the promise never breaks inside itself */
    .apb .apb-s {
        display: inline-block;
    }

    .apb .apb-stones {

        text-transform: uppercase;

    .apb .apb-stone-what {
        display: block;
        font: 400 14px/1.5 var(--apb-sans) !important;
        color: #B7AFA4 !important;
        margin-top: 4px;
        text-wrap: balance;
    }

    .apb .apb-below {
        font: 400 16px/1.5 var(--apb-sans) !important;
        color: #D8CFC0 !important;
        margin: 30px auto 0;
