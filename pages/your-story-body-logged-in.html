<!-- AP-LIB-v1.4 (v1.3 + the library named "Our Stories", dressed in the site's navy band and white cards, ending with the Your-story invitation card) · library + three-newest band on /your-story. Additive: touches nothing the page already has. -->
<style id="apLibStyle">
html.ap-lib .aph{display:none!important}
html.ap-lib body{background:#F6F2EA;overflow-x:hidden}
#apLibAll{display:block;text-align:center;margin:28px auto 0;font-family:"Source Sans Pro","Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;font-weight:600;font-size:16px;color:#8C6A3F!important;text-decoration:none!important}
#apLibAll span{display:inline-block;border-bottom:2px solid #B8945F;padding-bottom:2px}
#apLibAll small{font-weight:400;color:#6B6357;margin-left:8px;font-size:14px}
#apLib{width:100vw;margin-left:calc(50% - 50vw);background:#F6F2EA;color:#1F1D1A;font-family:"Source Serif Pro","Source Serif 4",Georgia,"Times New Roman",serif;font-size:17px;line-height:1.55;padding:0 0 72px}
#apLib *{box-sizing:border-box}
#apLib .aplib-in{max-width:1120px;margin:0 auto;padding:0 24px}
#apLib .aplib-band{background:#1F2A44;color:#FBF9F5;padding:34px 0 42px}
#apLib .aplib-back{display:inline-block;font-family:"Source Sans Pro","Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#B8945F!important;text-decoration:none!important}
#apLib .aplib-eyebrow{font-family:"Source Sans Pro","Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#B8945F;margin:28px 0 8px;text-align:center}
#apLib h2.aplib-h{font-family:"Source Serif Pro","Source Serif 4",Georgia,"Times New Roman",serif;font-weight:600;font-size:40px;line-height:1.1;margin:0;text-align:center;color:#fff}
#apLib .aplib-lede{text-align:center;max-width:60ch;margin:14px auto 0;color:#D9D2C3;font-size:17px}
#apLib .aplib-filters{display:flex;justify-content:center;flex-wrap:wrap;gap:30px;margin:8px 0 8px;padding:22px 0 12px;font-family:"Source Sans Pro","Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
#apLib .aplib-filters button{background:none;border:0;cursor:pointer;font:inherit;color:#6B6357;padding:0 0 6px;border-bottom:2px solid transparent}
#apLib .aplib-filters button small{color:#B8945F;margin-left:4px;font-size:13px}
#apLib .aplib-filters button.on{color:#1F1D1A;font-weight:600;border-bottom-color:#1F2A44}
#apLib .aplib-rows{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:10px}
#apLib a.aplib-row,#apLib a.aplib-you{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid #E4DCCB;padding:22px 24px 20px;text-decoration:none!important;color:#1F1D1A!important}
#apLib a.aplib-row *,#apLib a.aplib-you *{text-decoration:none!important}
#apLib a.aplib-row:hover,#apLib a.aplib-you:hover{border-color:#B8945F}
#apLib a.aplib-row.aplib-hid{display:none}
#apLib .aplib-meta{display:flex;justify-content:space-between;gap:12px;font-family:"Source Sans Pro","Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
#apLib .aplib-k{letter-spacing:.14em;text-transform:uppercase;color:#B8945F;font-size:11px}
#apLib .aplib-w{color:#6B6357;white-space:nowrap}
#apLib .aplib-t{font-family:"Source Serif Pro","Source Serif 4",Georgia,"Times New Roman",serif;font-size:23px;font-weight:600;line-height:1.2}
#apLib .aplib-l{font-size:16px;line-height:1.45;color:#1F1D1A}
#apLib .aplib-l::before{content:"\201C";color:#B8945F}
#apLib .aplib-l::after{content:"\201D";color:#B8945F}
#apLib .aplib-go{margin-top:auto;padding-top:8px;font-family:"Source Sans Pro","Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#8C6A3F;text-decoration:underline!important;text-underline-offset:3px;text-decoration-color:#B8945F!important}
#apLib a.aplib-you{background:#1F2A44;border-color:#1F2A44;color:#FBF9F5!important}
#apLib a.aplib-you .aplib-t{color:#fff}
#apLib a.aplib-you .aplib-l::before,#apLib a.aplib-you .aplib-l::after{content:none}
#apLib a.aplib-you .aplib-l{color:#FBF9F5}
#apLib a.aplib-you .aplib-go{color:#B8945F}
#apLib .aplib-morewrap{display:flex;justify-content:center;margin-top:30px}
#apLib .aplib-more{background:none;border:0;cursor:pointer;font-family:"Source Sans Pro","Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#8C6A3F;padding:0 0 2px;border-bottom:2px solid #B8945F}
#apLib .aplib-foot{text-align:center;font-family:"Source Sans Pro","Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;color:#6B6357;margin-top:40px}
#apLib .aplib-empty{text-align:center;color:#6B6357;margin-top:36px}
#write-your-story{scroll-margin-top:110px}
@media (max-width:820px){#apLib .aplib-rows{grid-template-columns:1fr}#apLib .aplib-filters{gap:18px}#apLib h2.aplib-h{font-size:30px}#apLib .aplib-band{padding:24px 0 32px}}
</style>
<script>
(function () {
  var HUB_ID = 'el_1788781991119_340', NEWEST = 3, SHOW_FIRST = 12;
  var q = new URLSearchParams(location.search);
  if (q.get('p')) {                                          // a story page: only repoint its back link to the library
    var fixBack = function () {
      var root = document.getElementById('apsRoot'); if (!root) return false;
      var as = root.querySelectorAll('a'), hit = false;
      for (var i = 0; i < as.length; i++) {
        if (/all their stories|our stories/i.test(as[i].textContent) && (as[i].getAttribute('href') || '').indexOf('stories=all') < 0) {
          as[i].setAttribute('href', '/your-story?stories=all');
          as[i].textContent = as[i].textContent.replace(/all their stories/i, 'Our stories');
          hit = true;
        }
      }
      return hit;
    };
    var tries = 0, t = setInterval(function () { if (fixBack() || ++tries > 40) clearInterval(t); }, 250);
    return;
  }
  var LIB = q.get('stories') === 'all';
  var SHELVES = [
    { key: 'poetry',  name: 'Poetry',  sub: 'Where I’m From' },
    { key: 'prayer',  name: 'Prayer',  sub: 'A Lament' },
    { key: 'courses', name: 'Courses', sub: 'Here I Am · The Man Who Crossed' },
    { key: 'friends', name: 'Friends', sub: 'Friends of Ancient Path' }
  ];
  if (LIB) document.documentElement.classList.add('ap-lib');

var feedReady = false, applyFn = null;
var readyTimer = setTimeout(markFeedReady, 5000);
function markFeedReady() {
if (feedReady) return;
feedReady = true;
clearTimeout(readyTimer);
if (applyFn) applyFn();
}
var apHookTries = 0;
(function apHookRender() {
var fn = window.apItowRender;
if (typeof fn === 'function' && !fn.__apWrapped) {
var wrapped = function () {
var r;
try { r = fn.apply(this, arguments); } finally { markFeedReady(); }
return r;
};
wrapped.__apWrapped = true;
window.apItowRender = wrapped;
return;
}
if (apHookTries++ < 60) setTimeout(apHookRender, 100);
})();

  function shelfOf(path) {
    var p = (path || '').toLowerCase();
    if (/friend/.test(p)) return 'friends';
    if (/from/.test(p)) return 'poetry';
    if (/lament|prayer|psalm/.test(p)) return 'prayer';
    return 'courses';
  }
  function clean(s) { return (s || '').replace(/\s+/g, ' ').replace(/^[\s"“‘']+|[\s"”’']+$/g, '').trim(); }
  function firstSentence(txt) {
    var t = clean(txt).split(/\s+…(?:\s|$)|\s+\.\.\.(?:\s|$)/)[0].replace(/\s*…$/, '');   // the card's own " … " join marks a cut
    var m = /^[\s\S]{40,}?[.!?](?=\s|$)/.exec(t);            // first sentence end after 40 chars
    var s = m ? m[0] : t;
    if (s.length > 110) { s = s.slice(0, 110); s = s.slice(0, s.lastIndexOf(' ')) + '…'; }
    return s;
  }
  function txt(n) { return n ? clean(n.textContent) : ''; }
  /* Card markup as read live Sept 10: a.aph-card.itow-card > p.aph-card-k ("Path " + span.nm) · p.aph-card-t · blockquote (first chunk, span.d " … ", rest) · span.aph-card-go */
  function parse(card) {
    var href = card.getAttribute('href') || '', id = (/[?&]p=([^&#]+)/.exec(href) || [])[1] || '';
    var k = card.querySelector('.aph-card-k'), nm = k && k.querySelector('.nm'), path = '';
    if (k) { for (var n = k.firstChild; n; n = n.nextSibling) if (n.nodeType === 3) path += n.textContent; }
    path = clean(path);
    var who = txt(nm);
    var title = txt(card.querySelector('.aph-card-t')) || path || 'Read it';
    var bq = card.querySelector('blockquote'), body = '';
    if (bq) {
      var d = bq.querySelector('.d');
      if (d) { for (var c = bq.firstChild; c && c !== d; c = c.nextSibling) body += c.textContent; } else body = bq.textContent;
    }
    body = clean(body);
    return { href: href, id: id, path: path, who: who, title: title, first: firstSentence(body), body: body };
  }
  function cards(grid) { return Array.prototype.slice.call(grid.querySelectorAll('a.itow-card')); }

  /* ---- hub: keep the three newest, add the way to the library ---- */
  function hubMode(el, grid) {
    var cs = cards(grid), n = cs.length; if (!n) return;
    cs.forEach(function (c, i) {
      var keep = i >= n - NEWEST;
      c.style.display = keep ? '' : 'none';
      c.style.order = keep ? String(n - i) : '';          // newest first
    });
    if (!feedReady) return;
var a = el.querySelector('#apLibAll');
    if (!a) {
      a = document.createElement('a'); a.id = 'apLibAll'; a.href = '/your-story?stories=all';
      grid.parentNode.insertBefore(a, grid.nextSibling);
    }
    a.innerHTML = '<span>Our stories →</span><small>' + n + ' so far</small>';
  }

  /* ---- library: shelves by path, newest first, first line of each piece ---- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var YOU = '<a class="aplib-you" href="/your-story#write-your-story"><span class="aplib-meta"><span class="aplib-k">Your story</span></span>' +
    '<span class="aplib-t">It belongs here.</span><span class="aplib-l">One hour. Your own words. Start with Where I’m From.</span><span class="aplib-go">Begin →</span></a>';
  function libMode(el, grid) {
    var items = cards(grid).map(parse).reverse();            // DOM order is oldest→newest; show newest first
    var lib = document.getElementById('apLib');
    if (!lib) { lib = document.createElement('section'); lib.id = 'apLib'; el.appendChild(lib); }
    var html = '<div class="aplib-band"><div class="aplib-in"><a class="aplib-back" href="/your-story">← Your Story</a>' +
      '<p class="aplib-eyebrow">My story · Your story · Our stories</p><h2 class="aplib-h">Our Stories</h2>' +
      '<p class="aplib-lede">Written by men who walked this path. Yours belongs here too.</p></div></div><div class="aplib-in">';
    if (!items.length) html += '<p class="aplib-empty">The stories are still loading. If nothing appears, go back and try again.</p><div class="aplib-rows">' + YOU + '</div>';
    else {
      var counts = {}; items.forEach(function (it) { var k = shelfOf(it.path); counts[k] = (counts[k] || 0) + 1; });
      if (feedReady) {
html += '<div class="aplib-filters"><button type="button" class="on" data-f="all">All<small>' + items.length + '</small></button>';
      SHELVES.forEach(function (sh) { if (counts[sh.key]) html += '<button type="button" data-f="' + sh.key + '">' + esc(sh.name) + '<small>' + counts[sh.key] + '</small></button>'; });
      html += '</div>'; }
html += '<div class="aplib-rows">';
      items.forEach(function (it, i) {
        var shelf = shelfOf(it.path);
        html += '<a class="aplib-row' + (i >= SHOW_FIRST ? ' aplib-hid' : '') + '" data-shelf="' + shelf + '" href="' + esc(it.href) + '">' +
          '<span class="aplib-meta"><span class="aplib-k">' + esc(it.path) + '</span><span class="aplib-w">' + esc(it.who) + '</span></span>' +
          '<span class="aplib-t">' + esc(it.title) + '</span>' +
          (it.first ? '<span class="aplib-l">' + esc(it.first) + '</span>' : '') +
          '<span class="aplib-go">' + (shelf === 'friends' ? 'Read the story →' : 'Read his story →') + '</span></a>';
      });
      html += YOU + '</div>';
      if (items.length > SHOW_FIRST) html += '<div class="aplib-morewrap"><button type="button" class="aplib-more">Show all ' + items.length + ' →</button></div>';
    }
    html += '<p class="aplib-foot">Every story opens on its own page, and its author can take it down whenever he chooses.</p></div>';
    lib.innerHTML = html;
    document.title = 'Our Stories — Ancient Path Biblical Coaching';
  }
  function applyFilter(lib, key, showAll) {
    var rows = lib.querySelectorAll('a.aplib-row'), shown = 0;
    for (var i = 0; i < rows.length; i++) {
      var match = key === 'all' || rows[i].getAttribute('data-shelf') === key;
      var vis = match && (showAll || shown < SHOW_FIRST);
      if (match && vis) shown++;
      rows[i].classList.toggle('aplib-hid', !vis);
    }
    var more = lib.querySelector('.aplib-morewrap'); if (more) more.style.display = (!showAll && shown < countMatch(rows, key)) ? '' : 'none';
    lib.querySelectorAll('.aplib-filters button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-f') === key); });
  }
  function countMatch(rows, key) { var n = 0; for (var i = 0; i < rows.length; i++) if (key === 'all' || rows[i].getAttribute('data-shelf') === key) n++; return n; }
  document.addEventListener('click', function (e) {
    var lib = document.getElementById('apLib'); if (!lib) return;
    var f = e.target.closest && e.target.closest('.aplib-filters button');
    if (f) { applyFilter(lib, f.getAttribute('data-f'), false); return; }
    var m = e.target.closest && e.target.closest('button.aplib-more');
    if (m) { var on = lib.querySelector('.aplib-filters button.on'); applyFilter(lib, on ? on.getAttribute('data-f') : 'all', true); }
  });

  /* ---- run when the cards exist, and again whenever the feed adds more ---- */
  var timer = null, tries = 0;
  function run() {
    var el = document.getElementById(HUB_ID), grid = el && el.querySelector('.itow-grid');
    if (!grid) { if (tries++ < 40) setTimeout(run, 250); return; }
    var apply = function () { LIB ? libMode(el, grid) : hubMode(el, grid); };
applyFn = apply;
    apply();
    new MutationObserver(function () { clearTimeout(timer); timer = setTimeout(apply, 400); }).observe(grid, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
})();
</script>
